<!DOCTYPE html>
<html>
<head>
<title>Learning Journey Tracker</title>
 
<style>
body {
  font-family: Arial;
  max-width: 800px;
  margin: auto;
  padding: 20px;
  background: #f5f5f5;
}
 
.card {
  background: white;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 0 10px #ccc;
  margin-bottom: 20px;
}
 
.locked {
  color: red;
  font-weight: bold;
}
 
button {
  padding: 10px 15px;
  background: #5b2d90;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}
</style>
 
<script>
 
let currentDay = 1;
 
function openDay(day) {
  if (day > currentDay) {
    alert("Access Denied. Future training day is locked.");
    return;
  }
 
  document.getElementById("attendanceSection").style.display = "block";
}
 
function submitAttendance() {
  let name = document.getElementById("name").value;
  if (name == "") {
    alert("Enter Name");
    return;
  }
 
  alert("Attendance Recorded Successfully!");
}
</script>
 
</head>
 
<body>
 
<div class="card">
  <h1>Learning Journey Tracker</h1>
  <h2>Current Training Day: DAY 1</h2>
  <p>One QR Code for entire training journey.</p>
</div>
 
<div class="card">
  <h3>Training Schedule</h3>
  <button onclick="openDay(1)">Day 1 ✅</button>
  <button onclick="openDay(2)">Day 2 🔒</button>
  <button onclick="openDay(3)">Day 3 🔒</button>
  <button onclick="openDay(4)">Day 4 🔒</button>
</div>
 
<div id="attendanceSection" style="display:none;" class="card">
  <h3>Attendance & Knowledge Check</h3>
  <input id="name" placeholder="Employee Name"><br><br>
  <input id="id" placeholder="Employee ID"><br><br>
 
  <p>What is Benefit Selling?</p>
  <input type="radio" name="q"> Reading product features<br>
  <input type="radio" name="q" checked> Explaining benefits that solve customer needs<br>
  <input type="radio" name="q"> Discussing competitors<br>
  <input type="radio" name="q"> Shortening the call<br><br>
 
  <button onclick="submitAttendance()">Submit</button>
</div>
 
</body>
</html>
